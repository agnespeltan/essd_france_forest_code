# Copy to config.yaml and edit paths for your machine.
# Or pass --config /path/to/config.yaml

output_dir: /path/to/Resultat_France/Data_clean
# IGN SER polygons (codeser A11 → numeric 111, or ser_num)
ser_shapefile: /path/to/IGN_donnees/France_ser.shp
france_outline_shapefile: /path/to/IGN_donnees/France_1km.shp   # optional map outline
# Optional (reserved for future overlays)

# Disturbance trends to attach mean harvest age onto (from essd_disturbances)
trends_csv: /path/to/Resultat_France/Data_clean/disturbance_trends.csv

# PNGs from 02_make_figures.py (same folder as other ESSD figures)
figure_dir: /path/to/Resultat_France/Figures/ESSD

nfi:
  placette: /path/to/Inventaire_national_forestier/PLACETTE.csv
  arbre: /path/to/Inventaire_national_forestier/ARBRE.csv
  csv_sep: ";"

# ESPAR→TFV and age corrections (defaults: package data/*.csv — no Excel)
# species:
#   espar_to_tfv: data/espar_to_tfv.csv
#   espar_corr_age: data/espar_corr_age.csv

include_mixtures: true   # also assign trees to TFV 80/90/100
age_offset: 3            # age = AGE13 + corr_age + age_offset
max_age13: 500
min_count: 5             # cascade fill only if NFI count > min_count

# Sparse TFV ← denser source (order matters)
# 200 (mixed conifers) is built from NFI as 80∪90 — not aliased.
tfv_aliases:
  - [401, 100]
  - [402, 200]
  - [111, 100]
  - [222, 200]
  - [310, 100]
  - [320, 200]
  - [403, 401]
  - [58, 200]   # mountain/stone pines ← mixed conifers

outputs:
  ages_tfv: age_coupe_TFV_NFI.csv
  ages_greco_tfv: age_coupe_greco_TFV_NFI.csv
  ages_ser_tfv: age_coupe_ser_TFV_NFI.csv
  ages_ser_forest: age_coupe_ser_forest_NFI.csv  # diagnostic only (not used in attach)
  ages_greco: age_coupe_greco_NFI.csv
  ages_national: age_coupe_NFI.csv
  harvest_age_table: mean_harvest_age.csv
  trends_with_harvest_age: disturbance_trends_with_harvest_age.csv
